# Copy to ~/.config/ews-meeting-reminders/config.yaml
# Secret: export EWS_PASSWORD=... or put password below.

ews:
  server: "https://mail.company.com/EWS/Exchange.asmx"
  email: "you@company.com"
  # DOMAIN\user or user@company.com; empty = use email
  username: ""
  password: ""
  # ntlm (typical on-prem) | basic
  auth: ntlm
  verify_ssl: true

reminders:
  offsets_minutes: [5, 0]
  poll_seconds: 30
  # EWS MyResponseType: Accept | Organizer | Tentative | Decline | NoResponseReceived | Unknown
  include_response_types: [Accept, Organizer, Tentative]
  lookahead_hours: 12
  grace_after_seconds: 90
  # How long to keep shown-notification records in the state file.
  # Every poll pass prunes entries older than this. Default: 24h.
  state_keep_hours: 24
  # Re-fire delay after «Отложить» when no later offsets remain before start.
  # If an unfired offsets_minutes lies between now and start, snooze to that time instead.
  # If less time remains until start than this value (and no later offsets), re-fire at start.
  snooze_minutes: 5

notify:
  app_name: "Встречи Exchange"
  urgency: critical
  open_action_label: "Открыть ссылку"
  # «Отложить»: close and remind again after snooze_minutes (legacy key name).
  skip_action_label: "Отложить"
  # «Отложить все»: snooze current + all queued cards (legacy key name).
  skip_all_action_label: "Отложить все"
  # «Прекратить»: no more reminders for this meeting.
  stop_action_label: "Прекратить"
  # Command to open join URLs; URL is appended as the last argument.
  # Example: "xterm -e xdg-open"
  open_url_cmd: xdg-open
  join_hosts:
    - "*.ktalk.ru"
    - trueconf.x.com
    - zoom.us
    - "*.zoom.us"
